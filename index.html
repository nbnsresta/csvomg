<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131620" />
    
    <title>csvomg</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Applies a stored theme preference before first paint, avoiding a flash of the wrong
         theme — must run synchronously here; src/main.ts loads as a deferred module, after the
         body has already rendered. See src/io/settings.ts (same storage key, same shape). -->
    <script>
      (function () {
        try {
          var settings = JSON.parse(localStorage.getItem('csvomg-settings'));
          if (settings && (settings.theme === 'dark' || settings.theme === 'light')) {
            document.documentElement.dataset.theme = settings.theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- App Shell -->
    <header id="toolbar">
      <div class="toolbar-brand">csvomg</div>
      <div class="toolbar-actions">
        <button id="btn-toolbar-new" class="btn btn-secondary">New</button>
        <button id="btn-toolbar-open" class="btn btn-secondary">Open...</button>
        <div class="split-btn">
          <button id="btn-toolbar-save" class="btn btn-primary split-btn-main" disabled>Save</button>
          <button id="btn-toolbar-save-menu" class="btn btn-primary split-btn-arrow" disabled aria-label="Save options" aria-haspopup="menu"></button>
        </div>
        <button id="btn-toolbar-settings" class="icon-btn" aria-label="Settings"></button>
      </div>
    </header>
    <nav id="tab-bar"></nav>
    <main id="app-viewport">
      <!-- Empty state by default -->
      <div id="empty-state">
        <div class="drop-zone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <h2>Drop a CSV or JSON file here</h2>
          <p>or</p>
          <div class="action-buttons">
            <button id="btn-open-file" class="btn btn-primary">Open File...</button>
            <button id="btn-new-file" class="btn btn-secondary">Start Fresh</button>
          </div>
        </div>
        
        <div id="recent-files-container" class="hidden">
          <h3>Recent Files</h3>
          <ul id="recent-files-list"></ul>
        </div>
      </div>
      <!-- UI-scale zoom (src/ui/zoom.ts) applies here only — not to the toolbar/tab-bar/status-bar
           chrome above/below — so turning it up doesn't shift buttons and controls around, just
           the data being read. See STATUS.md's "Zoom / scale slider" notes for why this is safe:
           position: absolute; inset: 0 on a non-root zoomed element still exactly fills its real
           (unzoomed) parent, verified empirically. -->
      <div id="grid-container" class="hidden"></div>
    </main>
    <footer id="status-bar">
      <div class="status-left" id="status-selection">Ready</div>
      <button type="button" id="status-warning" class="status-warning hidden"></button>
      <div class="status-right-group">
        <div class="status-zoom" id="status-zoom"></div>
        <div class="status-right" id="status-counts"></div>
      </div>
    </footer>

    <!-- Native Dialogs -->
    <dialog id="dialog-import"></dialog>
    <dialog id="dialog-export"></dialog>
    <dialog id="dialog-save-as"></dialog>
    <dialog id="dialog-fill"></dialog>
    <dialog id="dialog-settings"></dialog>

    <!-- Whole-page drop target overlay, shown while dragging a file anywhere over the app -->
    <div id="page-drop-overlay">
      <div class="page-drop-overlay-inner">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <h2>Drop to open</h2>
        <p>CSV or JSON &middot; opens in a new tab</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
