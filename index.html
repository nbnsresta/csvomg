<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131620" />

    <title>csvomg — Free Browser-Based CSV &amp; JSON Editor</title>
    <meta name="description" content="Free browser-based CSV &amp; JSON editor. Open, edit, and save files directly on your computer — no uploads, no accounts, and nothing ever leaves your browser." />
    <link rel="canonical" href="https://csvomg.com/" />

    <!-- Open Graph / Twitter Card — shown when a search engine or social platform first crawls
         the URL and needs a title/description/preview image to show for it. og-image.png is a
         static 1200x630 branded card (public/og-image.png), not a live app screenshot, so it
         always renders cleanly regardless of what a real user happened to have open. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://csvomg.com/" />
    <meta property="og:site_name" content="csvomg" />
    <meta property="og:title" content="csvomg — Free Browser-Based CSV &amp; JSON Editor" />
    <meta property="og:description" content="Open, edit, and save CSV, TSV, and JSON files directly on your computer using the File System Access API. No uploads, no accounts, no data transmission — everything happens locally in your browser." />
    <meta property="og:image" content="https://csvomg.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="csvomg — Free Browser-Based CSV &amp; JSON Editor" />
    <meta name="twitter:description" content="Open, edit, and save CSV, TSV, and JSON files directly on your computer — no uploads, no accounts, no data transmission." />
    <meta name="twitter:image" content="https://csvomg.com/og-image.png" />

    <!-- Structured data (schema.org, via Google's recommended JSON-LD format) — tells a crawler
         exactly what kind of thing this page is (a free, browser-based software application) and
         what it does, beyond what plain meta tags can express. See STATUS.md's "SEO basics" note
         for why SoftwareApplication/BrowserApplication was chosen over a plain WebSite type. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "csvomg",
        "url": "https://csvomg.com/",
        "description": "A free, browser-based CSV and JSON editor that reads and writes files directly on your computer via the File System Access API. No uploads, no accounts, no data transmission — everything happens locally in the browser.",
        "applicationCategory": "BrowserApplication",
        "operatingSystem": "Any (runs in a modern web browser)",
        "browserRequirements": "Requires a browser with File System Access API support, e.g. Chrome or Edge",
        "image": "https://csvomg.com/og-image.png",
        "screenshot": "https://csvomg.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Open and edit CSV, TSV, and JSON files, including converting between them on save",
          "Direct local file read/write with no upload or download round-trip",
          "Work on several files at once, each in its own tab",
          "Undo/redo, find & replace, sort, and fill selections",
          "Drag to reorder rows and columns",
          "Optional auto-save straight back to the linked file",
          "Installable as an offline-capable app"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Applies a stored theme preference before first paint, avoiding a flash of the wrong
         theme — must run synchronously here; src/main.ts loads as a deferred module, after the
         body has already rendered. See src/io/settings.ts (same storage key, same shape). -->
    <script>
      (function () {
        try {
          var settings = JSON.parse(localStorage.getItem('csvomg-settings'));
          if (settings && (settings.theme === 'dark' || settings.theme === 'light')) {
            document.documentElement.dataset.theme = settings.theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- App Shell -->
    <header id="toolbar">
      <div class="toolbar-brand">csvomg</div>
      <div class="toolbar-actions">
        <button id="btn-toolbar-new" class="btn btn-secondary">New</button>
        <button id="btn-toolbar-open" class="btn btn-secondary">Open...</button>
        <div class="split-btn">
          <button id="btn-toolbar-save" class="btn btn-primary split-btn-main" disabled>Save</button>
          <button id="btn-toolbar-save-menu" class="btn btn-primary split-btn-arrow" disabled aria-label="Save options" aria-haspopup="menu"></button>
        </div>
        <button id="btn-toolbar-about" class="icon-btn" aria-label="About csvomg"></button>
        <button id="btn-toolbar-settings" class="icon-btn" aria-label="Settings"></button>
      </div>
    </header>
    <nav id="tab-bar"></nav>
    <main id="app-viewport">
      <!-- Empty state by default -->
      <div id="empty-state">
        <div class="drop-zone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <h2>Drop a CSV or JSON file here</h2>
          <p>or</p>
          <div class="action-buttons">
            <button id="btn-open-file" class="btn btn-primary">Open File...</button>
            <button id="btn-new-file" class="btn btn-secondary">Start Fresh</button>
          </div>
        </div>
        
        <div id="recent-files-container" class="hidden">
          <h3>Recent Files</h3>
          <ul id="recent-files-list"></ul>
        </div>
      </div>
      <!-- UI-scale zoom (src/ui/zoom.ts) applies here only — not to the toolbar/tab-bar/status-bar
           chrome above/below — so turning it up doesn't shift buttons and controls around, just
           the data being read. See STATUS.md's "Zoom / scale slider" notes for why this is safe:
           position: absolute; inset: 0 on a non-root zoomed element still exactly fills its real
           (unzoomed) parent, verified empirically. -->
      <div id="grid-container" class="hidden"></div>
    </main>
    <footer id="status-bar">
      <div class="status-left" id="status-selection">Ready</div>
      <button type="button" id="status-warning" class="status-warning hidden"></button>
      <div class="status-right-group">
        <div class="status-zoom" id="status-zoom"></div>
        <div class="status-right" id="status-counts"></div>
      </div>
    </footer>

    <!-- Native Dialogs -->
    <dialog id="dialog-import"></dialog>
    <dialog id="dialog-export"></dialog>
    <dialog id="dialog-save-as"></dialog>
    <dialog id="dialog-fill"></dialog>
    <dialog id="dialog-settings"></dialog>
    <dialog id="dialog-about"></dialog>
    <dialog id="dialog-modal"></dialog>

    <!-- Whole-page drop target overlay, shown while dragging a file anywhere over the app -->
    <div id="page-drop-overlay">
      <div class="page-drop-overlay-inner">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <h2>Drop to open</h2>
        <p>CSV or JSON &middot; opens in a new tab</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
